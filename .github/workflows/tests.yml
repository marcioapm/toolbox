name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Report both jobs independently: with the default fail-fast, one job's
      # failure cancels the other and its cancellation looks like a second,
      # unrelated failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          # -v block-buffers through a pipe, so the last PASSED line lags real
          # execution and misreports where the run died.
          PYTHONUNBUFFERED: "1"
        run: |
          echo "pytest-start-epoch=$(date +%s)" >> "$GITHUB_ENV"
          pytest -v -p no:cacheprovider

      # Runs during cancellation teardown, which the pytest step itself does
      # not survive: an external cancel tears down that step's process group
      # before any trailing command executes.
      - name: Runner state
        if: always()
        continue-on-error: true
        run: |
          echo "elapsed_in_pytest_step=$(( $(date +%s) - ${pytest_start_epoch:-$(date +%s)} ))s"
          echo "--- cgroup memory.events / peak / max ---"
          cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max 2>/dev/null || echo "(unavailable)"
          echo "--- free -m ---"
          free -m || true
          echo "--- disk ---"
          df -h / /home/runner /tmp 2>/dev/null || true
          echo "--- nproc / loadavg / uptime ---"
          nproc; cat /proc/loadavg; uptime
          echo "--- surviving python/pytest processes ---"
          ps -eo pid,ppid,pgid,stat,rss,etime,comm | grep -E "pytest|python" | head -40 || true
          echo "--- dmesg (oom/kill/memory) ---"
          sudo dmesg 2>/dev/null | tail -80 | grep -iE "oom|kill|memory" || echo "(none or unavailable)"
        env:
          pytest_start_epoch: ${{ env.pytest-start-epoch }}
