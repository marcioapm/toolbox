name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: |
          set +e
          pytest -v -p no:cacheprovider
          rc=$?
          echo "::group::post-run diagnostics (pytest rc=$rc)"
          echo "--- cgroup memory.events ---"
          cat /sys/fs/cgroup/memory.events 2>/dev/null || echo "(unavailable)"
          echo "--- cgroup memory.peak / max ---"
          cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "(unavailable)"
          cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "(unavailable)"
          echo "--- free -m ---"
          free -m || true
          echo "--- nproc / loadavg ---"
          nproc; cat /proc/loadavg
          echo "--- surviving python/pytest processes ---"
          ps -eo pid,ppid,pgid,stat,rss,etime,comm,args | grep -E "pytest|python" | head -40 || true
          echo "--- dmesg tail (oom/kill lines) ---"
          sudo dmesg 2>/dev/null | tail -60 | grep -iE "oom|kill|memory" || echo "(none or unavailable)"
          echo "::endgroup::"
          exit $rc
