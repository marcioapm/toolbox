name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      # Report both jobs independently: with the default fail-fast, one job's
      # failure cancels the other and its cancellation looks like a second,
      # unrelated failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Smoke test entry points
        run: |
          for script in gemini-image gemini-transcribe gemini-tts gemini-video gemini-vision slackcli llm-usage; do
            if ! "$script" --help > /dev/null 2>&1; then
              echo "FAILED: $script --help"
              exit 1
            fi
          done
